image:
  distribution: ubuntu
  release: noble
  architecture: amd64
  description: 'Qiln Base Capsule Image (Python 3.13 / Node v22)'

source:
  downloader: debootstrap
  url: http://archive.ubuntu.com/ubuntu
  keyserver: keyserver.ubuntu.com
  keys:
    - 0xF6ECB3762474EDA9D21B7022871920D1991BC93C # Ubuntu Archive Automatic Signing Key (2018)

packages:
  manager: apt
  update: true
  cleanup: true
  sets:
    - packages:
        # Early Packages
        - ca-certificates
        - wget
        - gnupg
      action: install
      early: true

    - packages:
        # Base System Utilities & Networking
        - tzdata
        - tar
        - vim
        - systemd
        - systemd-sysv
        - netplan.io
        - iproute2
        - locales
        - curl
        - rsync
        - cloud-init
        - openssh-server
        # Toolchains & Compilers
        - build-essential
        - g++
        - git
        - cmake
        # Compression & Extraction Primitives
        - unzip
        - zstd
        - gzip
        # Media & Hardware Interface Codecs
        - libgl1
        - libglx-mesa0
        - libglib2.0-0
        - ffmpeg
        # Runtimes
        - python3.13
        - python3.13-dev
        - python3.13-venv
        - nodejs
      action: install

  repositories:
    # Standard Ubuntu Repositories
    - name: sources.list
      url: |-
        deb http://archive.ubuntu.com/ubuntu {{ image.release }} main restricted universe multiverse
        deb http://archive.ubuntu.com/ubuntu {{ image.release }}-updates main restricted universe multiverse
        deb http://security.ubuntu.com/ubuntu {{ image.release }}-security main restricted universe multiverse
    # Python 3.13 Deadsnakes Repository
    - name: deadsnakes.list
      url: |-
        deb [signed-by=/etc/apt/keyrings/deadsnakes.gpg] https://ppa.launchpadcontent.net/deadsnakes/ppa/ubuntu {{ image.release }} main
    # NodeSource Node.js v22 Repository
    - name: nodesource.list
      url: |-
        deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main

actions:
  # Bootstrap GPG Keyrings securely prior to APT catalog execution
  - trigger: post-unpack
    action: |-
      #!/bin/sh
      set -eux

      # Ensure isolated, strict-permission keyring directories exist
      mkdir -p /etc/apt/keyrings
      chmod 755 /etc/apt/keyrings

      # NodeSource GPG signing key
      wget -qO- https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
      chmod 644 /etc/apt/keyrings/nodesource.gpg

      # Deadsnakes PPA signing key
      gpg --homedir /tmp --no-default-keyring --keyring /etc/apt/keyrings/deadsnakes.gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys F23C5A6CF475977595C89F51BA6932366A755776
      chmod 644 /etc/apt/keyrings/deadsnakes.gpg

  # User provisioning, filesystem layout, and virtual environments
  - trigger: post-packages
    action: |-
      #!/bin/sh
      set -ex

      # Enforce correct UTF-8 locales inside the image compilation context
      locale-gen en_US.UTF-8
      update-locale LANG=en_US.UTF-8

      # Provision the unprivileged qiln system runtime user (UID/GID 1000)
      groupadd -g 1000 qiln
      useradd -u 1000 -g 1000 -m -s /bin/bash -d /home/qiln qiln

      # Create bin/config storage paths for Qiln engine internal tasks
      mkdir -p /opt/qiln
      mkdir -p /opt/qiln/bin

      # Branch host keys are instance identity and must never be cloned from
      # the image build environment.
      rm -f /etc/ssh/ssh_host_*

      # This fixed root-owned substrate is defense in depth only. Host grants,
      # access fences, tickets, redemption, and relay closure remain the
      # authorization authority.
      install -d -o root -g root -m 0700 /etc/ssh/qiln
      install -o root -g root -m 0600 /dev/null /etc/ssh/qiln/authorized_keys

      # Bootstrap and isolate the Python 3.13 Global Virtual Environment
      python3.13 -m venv /opt/qiln/venv
      /opt/qiln/venv/bin/pip install --no-cache-dir --upgrade pip setuptools wheel

      # Bootstrap Node NPM
      npm install --global npm@latest

      # Apply recursive ownership limits to the qiln unprivileged user
      chown -R qiln:qiln /opt/qiln
      chown -R qiln:qiln /home/qiln

files:
  # Add cloud-init
  - name: meta-data
    generator: cloud-init
  - name: network-config
    generator: cloud-init
  - name: user-data
    generator: cloud-init
  - name: vendor-data
    generator: cloud-init

  # Prevent container machine-id overlapping
  - path: /etc/machine-id
    generator: dump
    content: ''

  - path: /var/lib/dbus/machine-id
    generator: remove

  # Systemd Network configuration
  - path: /etc/netplan/10-incus.yaml
    generator: dump
    content: |-
      network:
        version: 2
        ethernets:
          eth0:
            dhcp4: true
            dhcp-identifier: mac

  # Pin NodeSource Node.js packages to prevent upstream APT repository pollution
  - path: /etc/apt/preferences.d/nodejs
    generator: dump
    content: |-
      Package: nodejs
      Pin: origin deb.nodesource.com
      Pin-Priority: 600

  # The branch-local authorized-key file is a defense-in-depth availability
  # substrate. Host authorization does not depend on synchronization status.
  - path: /etc/ssh/qiln
    generator: dump
    uid: 0
    gid: 0
    mode: '0700'

  - path: /etc/ssh/qiln/authorized_keys
    generator: dump
    uid: 0
    gid: 0
    mode: '0600'
    content: ''

  - path: /etc/ssh/sshd_config.d/60-qiln.conf
    generator: dump
    uid: 0
    gid: 0
    mode: '0644'
    content: |-
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PermitEmptyPasswords no
      PermitRootLogin no
      PubkeyAuthentication yes
      AuthenticationMethods publickey
      AuthorizedKeysFile /etc/ssh/qiln/authorized_keys
      StrictModes yes

      HostbasedAuthentication no
      IgnoreRhosts yes
      PermitUserEnvironment no
      AllowAgentForwarding no
      AllowTcpForwarding no
      GatewayPorts no
      PermitTunnel no
      X11Forwarding no
      UseDNS no
      MaxAuthTries 3

      # TODO(ssh-ingress-acl): 10.0.0.0/8 is development-only. 
      # Production must enforce gateway-only branch SSH ingress with a 
      # Host-managed Incus ACL limited to the gateway private /32 before 
      # relying on eventual authorized-key synchronization.
      AllowUsers qiln@10.0.0.0/8

  # Generates only absent branch host keys, preserves the synchronized
  # authorized-key file, and validates the complete sshd configuration before
  # the stock SSH service may start.
  - path: /usr/local/sbin/qiln-sshd-bootstrap
    generator: dump
    uid: 0
    gid: 0
    mode: '0755'
    content: |-
      #!/bin/sh
      set -eu

      if [ -L /etc/ssh/qiln ] || { [ -e /etc/ssh/qiln ] && [ ! -d /etc/ssh/qiln ]; }; then
        echo "Invalid Qiln SSH authorized-key directory substrate." >&2
        exit 1
      fi

      install -d -o root -g root -m 0700 /etc/ssh/qiln

      if [ -L /etc/ssh/qiln/authorized_keys ]; then
        echo "Qiln SSH authorized-key file must not be a symbolic link." >&2
        exit 1
      fi

      if [ ! -e /etc/ssh/qiln/authorized_keys ]; then
        install -o root -g root -m 0600 /dev/null /etc/ssh/qiln/authorized_keys
      fi

      if [ ! -f /etc/ssh/qiln/authorized_keys ]; then
        echo "Qiln SSH authorized-key path must be a regular file." >&2
        exit 1
      fi

      chown root:root /etc/ssh/qiln/authorized_keys
      chmod 0600 /etc/ssh/qiln/authorized_keys

      # ssh-keygen -A preserves existing host keys and generates only missing
      # host-key types.
      ssh-keygen -A
      /usr/sbin/sshd -t -f /etc/ssh/sshd_config

  - path: /etc/systemd/system/qiln-sshd-bootstrap.service
    generator: dump
    uid: 0
    gid: 0
    mode: '0644'
    content: |-
      [Unit]
      Description=Prepare and validate Qiln branch SSH substrate
      Before=ssh.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/qiln-sshd-bootstrap
      RemainAfterExit=yes

  - path: /etc/systemd/system/ssh.service.d/qiln-bootstrap.conf
    generator: dump
    uid: 0
    gid: 0
    mode: '0644'
    content: |-
      [Unit]
      Requires=qiln-sshd-bootstrap.service
      After=qiln-sshd-bootstrap.service
