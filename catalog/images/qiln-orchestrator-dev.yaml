image:
  distribution: ubuntu
  release: noble
  architecture: amd64
  description: Qiln Orchestrator Development Image

source:
  downloader: debootstrap
  url: http://archive.ubuntu.com/ubuntu
  keyserver: keyserver.ubuntu.com
  keys:
    - 0xF6ECB3762474EDA9D21B7022871920D1991BC93C # Ubuntu Archive Automatic Signing Key (2018)

packages:
  manager: apt
  update: true
  cleanup: true
  sets:
    - packages:
        # Repository bootstrap dependencies must be present before APT reads
        # NodeSource, Caddy, and PGDG repository metadata.
        - ca-certificates
        - curl
        - gnupg
      action: install
      early: true

    - packages:
        # Minimum base needed for an Incus systemd container with DHCP networking.
        - systemd
        - systemd-sysv
        - netplan.io
        - iproute2
        - locales
        - git
        - vim
        - sudo
        - cloud-init
        - openssh-server
        # Qiln control-plane runtime primitives.
        - nodejs
        - caddy
        - nats-server
        - postgresql-18
        - postgresql-client-18
      action: install

  repositories:
    # Standard Ubuntu repositories.
    - name: sources.list
      url: |-
        deb http://archive.ubuntu.com/ubuntu {{ image.release }} main restricted universe multiverse
        deb http://archive.ubuntu.com/ubuntu {{ image.release }}-updates main restricted universe multiverse
        deb http://security.ubuntu.com/ubuntu {{ image.release }}-security main restricted universe multiverse

    # NodeSource Node.js v22 repository.
    - name: nodesource.list
      url: |-
        deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main

    # Official Caddy repository.
    - name: caddy-stable.list
      url: |-
        deb [signed-by=/etc/apt/keyrings/caddy-stable.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main

    # Official PostgreSQL repository.
    - name: pgdg
      url: |-
        deb [signed-by=/etc/apt/keyrings/postgresql.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main

actions:
  # Bootstrap repository keyrings before package installation.
  - trigger: post-unpack
    action: |-
      #!/bin/sh
      set -eux

      install -d -m 0755 /etc/apt/keyrings
      install -d -m 0755 /usr/share/postgresql-common/pgdg

      curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
        https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key |
        gpg --dearmor --yes --output /etc/apt/keyrings/nodesource.gpg
      chmod 0644 /etc/apt/keyrings/nodesource.gpg

      curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
        https://dl.cloudsmith.io/public/caddy/stable/gpg.key |
        gpg --dearmor --yes --output /etc/apt/keyrings/caddy-stable.gpg
      chmod 0644 /etc/apt/keyrings/caddy-stable.gpg

      curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
        https://www.postgresql.org/media/keys/ACCC4CF8.asc \
        --output /etc/apt/keyrings/postgresql.asc
      chmod 0644 /etc/apt/keyrings/postgresql.asc

  # Control-plane user, locale, SSH identity hygiene, and Qiln runtime paths.
  - trigger: post-packages
    action: |-
      #!/bin/sh
      set -eux

      locale-gen en_US.UTF-8
      update-locale LANG=en_US.UTF-8

      groupadd -g 1000 qiln
      useradd -u 1000 -g 1000 -m -s /bin/bash -d /home/qiln qiln

      # Bootstrap Node NPM
      npm install --global npm@latest

      install -d -o qiln -g qiln -m 0755 /opt/qiln
      install -d -o root -g root -m 0755 /etc/qiln

      # Host keys identify this orchestrator instance and must not be inherited
      # by every container created from this image.
      rm -f /etc/ssh/ssh_host_*

      # The deployed instance must initialize and use only its attached PostgreSQL volume.
      rm -rf /var/lib/postgresql/18/main

  # Validate generated configuration while removing temporary validation host
  # keys so deployed instances still generate their own SSH identities.
  - trigger: post-files
    action: |-
      #!/bin/sh
      set -eux

      caddy validate --config /etc/caddy/qiln.json
      visudo -cf /etc/sudoers.d/90-qiln-orchestrator-admin

      chown root:postgres /etc/postgresql/18/main/pg_hba.conf
      chmod 0640 /etc/postgresql/18/main/pg_hba.conf
      runuser -u postgres -- test -r /etc/postgresql/18/main/pg_hba.conf

      install -d -o root -g root -m 0755 /run/sshd

      ssh-keygen -A
      /usr/sbin/sshd -t -f /etc/ssh/sshd_config
      rm -f /etc/ssh/ssh_host_*
      rmdir /run/sshd

      systemctl enable ssh.service
      systemctl enable caddy.service
      systemctl enable postgresql.service
      systemctl enable qiln-postgres-bootstrap.service
      systemctl enable qiln-instance-bootstrap.service
      systemctl enable nats-server.service

      systemctl disable qiln-dev.service

files:
  # Incus/cloud-init image templates.
  - name: meta-data
    generator: cloud-init
  - name: network-config
    generator: cloud-init
  - name: user-data
    generator: cloud-init
  - name: vendor-data
    generator: cloud-init

  # Prevent cloned containers from sharing machine identity.
  - path: /etc/machine-id
    generator: dump
    content: ''

  - path: /var/lib/dbus/machine-id
    generator: remove

  # Basic DHCP networking for the control-plane container.
  - path: /etc/netplan/10-incus.yaml
    generator: dump
    content: |-
      network:
        version: 2
        ethernets:
          eth0:
            dhcp4: true
            dhcp-identifier: mac

  # Pin NodeSource Node.js packages to avoid accidental repository pollution.
  - path: /etc/apt/preferences.d/nodejs
    generator: dump
    mode: '0644'
    content: |-
      Package: nodejs
      Pin: origin deb.nodesource.com
      Pin-Priority: 600

  # PostgreSQL accepts TCP only on loopback and always reads mutable cluster
  # state from the attached persistent volume.
  - path: /etc/postgresql/18/main/conf.d/60-qiln-local.conf
    generator: dump
    uid: 0
    gid: 0
    mode: '0644'
    content: |-
      data_directory = '/var/lib/postgresql/18/main'
      listen_addresses = '127.0.0.1'
      unix_socket_directories = '/var/run/postgresql'
      password_encryption = 'scram-sha-256'

  # PostgreSQL administration and Qiln application access use local peer
  # authentication. TCP clients must use SCRAM credentials explicitly created
  # outside this image.
  - path: /etc/postgresql/18/main/pg_hba.conf
    generator: dump
    uid: 0
    gid: 0
    mode: '0640'
    content: |-
      local   all             postgres                                peer
      local   qiln            qiln                                    peer
      local   all             all                                     reject
      host    all             all             127.0.0.1/32            scram-sha-256
      host    all             all             ::1/128                 scram-sha-256

  # The PostgreSQL data directory must be an attached Incus volume. A new
  # volume is initialized once, while existing volumes are validated and reused.
  - path: /usr/local/sbin/qiln-postgres-volume-init
    generator: dump
    uid: 0
    gid: 0
    mode: '0755'
    content: |-
      #!/bin/sh
      set -eu

      POSTGRES_VOLUME='/var/lib/postgresql'
      POSTGRES_VERSION='18'
      POSTGRES_PARENT="${POSTGRES_VOLUME}/${POSTGRES_VERSION}"
      PGDATA="${POSTGRES_PARENT}/main"
      INITDB="/usr/lib/postgresql/${POSTGRES_VERSION}/bin/initdb"

      if [ -L "${POSTGRES_VOLUME}" ] || [ ! -d "${POSTGRES_VOLUME}" ]; then
        echo 'PostgreSQL persistent storage path must be a directory and cannot be a symbolic link.' >&2
        exit 1
      fi

      if ! /usr/bin/mountpoint --quiet "${POSTGRES_VOLUME}"; then
        echo 'PostgreSQL persistent storage volume is not mounted at /var/lib/postgresql.' >&2
        exit 1
      fi

      if [ -L "${POSTGRES_PARENT}" ]; then
        echo 'PostgreSQL version directory cannot be a symbolic link.' >&2
        exit 1
      fi

      if [ -L "${PGDATA}" ]; then
        echo 'PostgreSQL data directory cannot be a symbolic link.' >&2
        exit 1
      fi

      chown postgres:postgres "${POSTGRES_VOLUME}"
      chmod 0755 "${POSTGRES_VOLUME}"
      install -d -o postgres -g postgres -m 0755 "${POSTGRES_PARENT}"

      if [ ! -e "${PGDATA}" ]; then
        install -d -o postgres -g postgres -m 0700 "${PGDATA}"
      elif [ ! -d "${PGDATA}" ]; then
        echo 'PostgreSQL data path exists but is not a directory.' >&2
        exit 1
      fi

      if [ ! -e "${PGDATA}/PG_VERSION" ]; then
        if [ -n "$(find "${PGDATA}" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
          echo 'PostgreSQL data directory is non-empty but has no PG_VERSION file.' >&2
          exit 1
        fi

        chown postgres:postgres "${PGDATA}"
        chmod 0700 "${PGDATA}"

        /usr/sbin/runuser -u postgres -- "${INITDB}" \
          --pgdata="${PGDATA}" \
          --encoding=UTF8 \
          --locale=en_US.UTF-8 \
          --auth-local=peer \
          --auth-host=scram-sha-256
      fi

      if [ ! -f "${PGDATA}/PG_VERSION" ] || [ -L "${PGDATA}/PG_VERSION" ]; then
        echo 'PostgreSQL data directory has an invalid PG_VERSION file.' >&2
        exit 1
      fi

      if [ "$(cat "${PGDATA}/PG_VERSION")" != "${POSTGRES_VERSION}" ]; then
        echo 'PostgreSQL data volume belongs to an incompatible PostgreSQL major version.' >&2
        exit 1
      fi

      if [ "$(stat --format='%U:%G' "${PGDATA}")" != 'postgres:postgres' ]; then
        echo 'PostgreSQL data directory must be owned by postgres:postgres.' >&2
        exit 1
      fi

      case "$(stat --format='%a' "${PGDATA}")" in
        700|750)
          ;;
        *)
          echo 'PostgreSQL data directory permissions must be 0700 or 0750.' >&2
          exit 1
          ;;
      esac

      for required_directory in base global pg_wal; do
        if [ ! -d "${PGDATA}/${required_directory}" ] || [ -L "${PGDATA}/${required_directory}" ]; then
          echo "PostgreSQL data directory is missing required directory ${required_directory}." >&2
          exit 1
        fi
      done

  - path: /etc/systemd/system/qiln-postgres-volume-init.service
    generator: dump
    uid: 0
    gid: 0
    mode: '0644'
    content: |-
      [Unit]
      Description=Initialize or validate the persistent Qiln PostgreSQL volume
      After=local-fs.target
      Before=postgresql@18-main.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/qiln-postgres-volume-init
      RemainAfterExit=yes

  # PostgreSQL cannot start unless the dedicated persistent volume has been
  # initialized or validated successfully.
  - path: /etc/systemd/system/postgresql@18-main.service.d/qiln-volume.conf
    generator: dump
    uid: 0
    gid: 0
    mode: '0644'
    content: |-
      [Unit]
      Requires=qiln-postgres-volume-init.service
      After=qiln-postgres-volume-init.service

  # The bootstrap script creates only the local application role/database. It
  # intentionally does not run Qiln migrations because migrations belong to the
  # deployed application revision, not the reusable operating-system image.
  - path: /usr/local/sbin/qiln-postgres-bootstrap
    generator: dump
    uid: 0
    gid: 0
    mode: '0755'
    content: |-
      #!/bin/sh
      set -eu

      POSTGRES_RUNUSER='/usr/sbin/runuser -u postgres --'
      PSQL='/usr/bin/psql --dbname=postgres --no-align --tuples-only --set=ON_ERROR_STOP=1'

      if ! ${POSTGRES_RUNUSER} /usr/bin/pg_isready --quiet --host=/var/run/postgresql --port=5432 --dbname=postgres; then
        echo 'PostgreSQL is not ready for Qiln bootstrap.' >&2
        exit 1
      fi

      role_attributes="$(${POSTGRES_RUNUSER} ${PSQL} --command "SELECT rolsuper::text || '|' || rolcreatedb::text || '|' || rolcreaterole::text || '|' || rolreplication::text || '|' || rolbypassrls::text || '|' || rolcanlogin::text || '|' || rolinherit::text FROM pg_roles WHERE rolname = 'qiln'")"

      case "${role_attributes}" in
        '')
          ${POSTGRES_RUNUSER} ${PSQL} --command "CREATE ROLE qiln LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT"
          ;;
        'false|false|false|false|false|true|false')
          ;;
        *)
          echo 'Existing PostgreSQL role qiln has unexpected privileges or login attributes' >&2
          exit 1
          ;;
      esac

      database_owner="$(${POSTGRES_RUNUSER} ${PSQL} --command "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'qiln'")"

      case "${database_owner}" in
        '')
          ${POSTGRES_RUNUSER} /usr/bin/createdb --owner=qiln --encoding=UTF8 --template=template0 qiln
          ;;
        'qiln')
          ;;
        *)
          echo 'Existing PostgreSQL database qiln has an unexpected owner.' >&2
          exit 1
          ;;
      esac

      ${POSTGRES_RUNUSER} ${PSQL} --command "REVOKE ALL ON DATABASE qiln FROM PUBLIC"

  # PostgreSQL role and database creation remains separate from cluster volume
  # initialization because it requires a running PostgreSQL server.
  - path: /etc/systemd/system/qiln-postgres-bootstrap.service
    generator: dump
    uid: 0
    gid: 0
    mode: '0644'
    content: |-
      [Unit]
      Description=Initialize the local Qiln PostgreSQL role and database
      Requires=postgresql@18-main.service
      After=postgresql@18-main.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/qiln-postgres-bootstrap
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

  # One idempotent bootstrap owns SSH host keys identifying this concrete
  # orchestrator instance. ssh.service owns /run/sshd and validates its
  # configuration after this prerequisite succeeds.
  - path: /usr/local/sbin/qiln-instance-bootstrap
    generator: dump
    uid: 0
    gid: 0
    mode: '0755'
    content: |-
      #!/bin/sh
      set -eu

      /usr/bin/ssh-keygen -A

  - path: /etc/systemd/system/qiln-instance-bootstrap.service
    generator: dump
    uid: 0
    gid: 0
    mode: '0644'
    content: |-
      [Unit]
      Description=Initialize Qiln instance SSH identity
      After=local-fs.target
      Before=ssh.service nats-server.service qiln-dev.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/qiln-instance-bootstrap
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

  # The Capsule NATS channel treats connected publishers as trusted
  # control-plane peers. Development mode keeps that bus private to processes
  # running inside this one orchestrator container.
  #
  # The complete secret-bearing NATS configuration is delivered as a direct
  # per-instance Incus system credential and imported only by this service.
  - path: /etc/systemd/system/nats-server.service.d/qiln-credentials.conf
    generator: dump
    uid: 0
    gid: 0
    mode: '0644'
    content: |-
      [Unit]
      Requires=qiln-instance-bootstrap.service
      After=qiln-instance-bootstrap.service
      AssertCredential=nats-server.conf

      [Service]
      ImportCredential=nats-server.conf
      ExecStart=
      ExecStart=/usr/sbin/nats-server -c ${CREDENTIALS_DIRECTORY}/nats-server.conf
      NoNewPrivileges=true
      PrivateTmp=true

  # The reusable image contains no administrator key. The dedicated Incus
  # profile injects the authorized public key through cloud-init.
  - path: /etc/ssh/sshd_config.d/60-qiln-orchestrator.conf
    generator: dump
    uid: 0
    gid: 0
    mode: '0644'
    content: |-
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PermitEmptyPasswords no
      PermitRootLogin no

      PubkeyAuthentication yes
      AuthenticationMethods publickey
      AuthorizedKeysFile .ssh/authorized_keys
      StrictModes yes
      AllowUsers qiln

      AllowAgentForwarding no
      AllowTcpForwarding no
      GatewayPorts no
      PermitTunnel no
      X11Forwarding no
      PermitUserEnvironment no
      UseDNS no
      MaxAuthTries 3

  # SSH must not start until the concrete instance has generated host keys.
  # Ubuntu's ssh.service then owns /run/sshd and runs sshd -t in ExecStartPre.
  - path: /etc/systemd/system/ssh.service.d/qiln-instance-bootstrap.conf
    generator: dump
    uid: 0
    gid: 0
    mode: '0644'
    content: |-
      [Unit]
      Requires=qiln-instance-bootstrap.service
      After=qiln-instance-bootstrap.service

  # Password authentication disabled.
  - path: /etc/sudoers.d/90-qiln-orchestrator-admin
    generator: dump
    uid: 0
    gid: 0
    mode: '0440'
    content: |-
      qiln ALL=(ALL) NOPASSWD: ALL

  # Non-secret runtime configuration shared by Qiln systemd services.
  - path: /etc/qiln/runtime.env
    generator: dump
    uid: 0
    gid: 0
    mode: '0644'
    content: |-
      NODE_ENV=development
      FASTIFY_APP_PATH=/opt/qiln
      VITE_HOST_DEV=localhost

      PGHOST=/var/run/postgresql
      PGPORT=5432
      PGUSER=qiln
      DATABASE_URL=postgresql:///qiln
      NATS_SERVERS=nats://127.0.0.1:4222

      QILN_CADDY_ENDPOINT=http://127.0.0.1:2019
      QILN_CADDY_SERVER=qiln
      QILN_CADDY_FALLBACK_ID=qiln-route-fallback-experimental
      QILN_ROUTING_INGRESS_ENDPOINT=http://127.0.0.1:8080
      QILN_EMBEDDED_WORKER_ENABLED=true

      INCUS_ENDPOINT=unix:///run/qiln-incus.sock
      INCUS_REJECT_UNAUTHORIZED=true
      INCUS_PROJECT=default

      QILN_SSH_ENABLED=false
      QILN_SSH_TICKET_TTL_MS=30000
      QILN_SSH_RELAY_CLOSURE_TIMEOUT_MS=15000
      QILN_SSH_PUBLIC_HOST=ssh.qiln.example
      QILN_SSH_PUBLIC_PORT=2222
      QILN_SSH_GATEWAY_HOST_ALIAS=qiln-gateway
      QILN_SSH_BRANCH_HOST_ALIAS_PREFIX=qiln
      QILN_SSH_DEFAULT_IDENTITY_FILE=~/.ssh/id_ed25519_qiln
      QILN_SSH_GATEWAY_ENABLED=false
      QILN_SSH_GATEWAY_BIND_HOST=0.0.0.0
      QILN_SSH_GATEWAY_BIND_PORT=2222
      QILN_SSH_GATEWAY_INSTANCE_ID=
      QILN_SSH_GATEWAY_MAX_CONNECTIONS=8
      QILN_SSH_GATEWAY_MAX_RELAYS=4
      QILN_SSH_GATEWAY_AUTHENTICATION_TIMEOUT_MS=15000
      QILN_SSH_GATEWAY_CHANNEL_OPEN_TIMEOUT_MS=10000
      QILN_SSH_GATEWAY_BRANCH_DIAL_TIMEOUT_MS=10000

  # This development-only service runs the Qiln Host and embedded Worker in one
  # process. It requires the completed PostgreSQL bootstrap before process
  # startup so the application role and database are always available.
  #
  # The service is intentionally not enabled by the image. Deployment mounts or
  # installs the development source at /opt/qiln, installs its direct
  # per-instance Incus credentials, applies migrations, and then enables this
  # unit explicitly.
  - path: /etc/systemd/system/qiln-dev.service
    generator: dump
    uid: 0
    gid: 0
    mode: '0644'
    content: |-
      [Unit]
      Description=Qiln development server with embedded Worker
      Requires=postgresql@18-main.service qiln-postgres-bootstrap.service nats-server.service qiln-instance-bootstrap.service
      After=network-online.target postgresql@18-main.service qiln-postgres-bootstrap.service nats-server.service qiln-instance-bootstrap.service
      Wants=network-online.target
      ConditionPathExists=/opt/qiln/package.json
      AssertCredential=qiln-host.env

      [Service]
      Type=simple
      User=qiln
      Group=qiln
      WorkingDirectory=/opt/qiln
      EnvironmentFile=/etc/qiln/runtime.env
      Environment=QILN_LOAD_DOTENV=false
      ImportCredential=qiln-host.env
      ImportCredential=qiln-ssh-gateway-host-key
      Environment=QILN_HOST_CREDENTIAL_PATH=%d/qiln-host.env
      Environment=QILN_SSH_GATEWAY_HOST_KEY_PATH=%d/qiln-ssh-gateway-host-key
      ExecStartPre=/bin/sh -ec 'if [ "$${QILN_SSH_GATEWAY_ENABLED:-false}" = "true" ]; then test -r "$${CREDENTIALS_DIRECTORY}/qiln-ssh-gateway-host-key"; fi'
      ExecStart=/usr/bin/npm run server:dev
      TimeoutStopSec=30s
      UMask=0077
      NoNewPrivileges=true
      PrivateTmp=true

      [Install]
      WantedBy=multi-user.target

  # Qiln Caddy doesn't use the default Caddyfile.
  - path: /etc/caddy/Caddyfile
    generator: remove

  # Qiln Caddy starts from this exact native JSON route-array boundary.
  - path: /etc/caddy/qiln.json
    generator: dump
    uid: 0
    gid: 0
    mode: '0644'
    content: |-
      {
        "admin": {
          "listen": "127.0.0.1:2019"
        },
        "apps": {
          "http": {
            "servers": {
              "qiln": {
                "listen": [":8080"],
                "routes": [
                  {
                    "@id": "qiln-route-fallback-experimental",
                    "handle": [
                      {
                        "handler": "static_response",
                        "status_code": 404
                      }
                    ],
                    "terminal": true
                  }
                ]
              }
            }
          }
        }
      }

  - path: /etc/systemd/system/caddy.service.d/qiln-json.conf
    generator: dump
    uid: 0
    gid: 0
    mode: '0644'
    content: |-
      [Service]
      ExecStart=
      ExecStart=/usr/bin/caddy run --environ --config /etc/caddy/qiln.json
      ExecReload=
