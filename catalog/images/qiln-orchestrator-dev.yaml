image:
  distribution: ubuntu
  release: resolute
  architecture: amd64
  description: Qiln Orchestrator Development Image

source:
  downloader: debootstrap
  url: https://us.archive.ubuntu.com/ubuntu
  keyserver: keyserver.ubuntu.com
  keys:
    - 0xF6ECB3762474EDA9D21B7022871920D1991BC93C # Ubuntu Archive Automatic Signing Key (2018)

packages:
  manager: apt
  update: true
  cleanup: true
  sets:
    - packages:
        # Repository bootstrap dependencies must be present before APT reads
        # NodeSource, Caddy, and PGDG repository metadata.
        - ca-certificates
        - curl
        - gnupg
      action: install
      early: true

    - packages:
        # Minimum base needed for an Incus systemd container with DHCP networking.
        - systemd
        - systemd-sysv
        - netplan.io
        - iproute2
        - locales
        - git
        - vim
        - sudo
        - cloud-init
        - openssh-server
        - bash-completion
        - eza
        # Qiln control-plane runtime primitives.
        - nodejs
        - caddy
        - nats-server
        - postgresql-18
        - postgresql-client-18
      action: install

  repositories:
    # Standard Ubuntu repositories.
    - name: sources.list
      url: |-
        deb https://us.archive.ubuntu.com/ubuntu {{ image.release }} main restricted universe multiverse
        deb https://us.archive.ubuntu.com/ubuntu {{ image.release }}-updates main restricted universe multiverse
        deb https://security.ubuntu.com/ubuntu {{ image.release }}-security main restricted universe multiverse

    # NodeSource Node.js v22 repository.
    - name: nodesource.list
      url: |-
        deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main

    # Official Caddy repository.
    - name: caddy-stable.list
      url: |-
        deb [signed-by=/etc/apt/keyrings/caddy-stable.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main

    # Official PostgreSQL repository.
    - name: pgdg
      url: |-
        deb [signed-by=/etc/apt/keyrings/postgresql.asc] https://apt.postgresql.org/pub/repos/apt {{ image.release }}-pgdg main

actions:
  # Bootstrap repository keyrings before package installation.
  - trigger: post-unpack
    action: |-
      #!/bin/sh
      set -eux

      install -d -m 0755 /etc/apt/keyrings
      install -d -m 0755 /usr/share/postgresql-common/pgdg

      curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
        https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key |
        gpg --dearmor --yes --output /etc/apt/keyrings/nodesource.gpg
      chmod 0644 /etc/apt/keyrings/nodesource.gpg

      curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
        https://dl.cloudsmith.io/public/caddy/stable/gpg.key |
        gpg --dearmor --yes --output /etc/apt/keyrings/caddy-stable.gpg
      chmod 0644 /etc/apt/keyrings/caddy-stable.gpg

      curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
        https://www.postgresql.org/media/keys/ACCC4CF8.asc \
        --output /etc/apt/keyrings/postgresql.asc
      chmod 0644 /etc/apt/keyrings/postgresql.asc

  # Control-plane users, locale, SSH identity hygiene, and Qiln runtime paths.
  - trigger: post-packages
    action: |-
      #!/bin/sh
      set -eux

      locale-gen en_US.UTF-8
      update-locale LANG=en_US.UTF-8

      groupadd -g 1000 qiln
      groupadd -g 1001 qiln-ssh
      useradd -u 1000 -g 1000 -m -s /bin/bash -d /home/qiln qiln
      useradd -u 1001 -g 1001 -m -s /usr/sbin/nologin -d /home/qiln-ssh qiln-ssh

      cat >> /home/qiln/.bashrc <<'EOF'
      # Qiln interactive shell conveniences.
      if [[ $- == *i* ]]; then
        if [[ -z ${BASH_COMPLETION_VERSINFO:-} ]] && [[ -r /usr/share/bash-completion/bash_completion ]]; then
          . /usr/share/bash-completion/bash_completion
        fi
        alias ll='eza -lah --group-directories-first'
        alias lt='eza -lah --sort=modified --group-directories-first'
      fi
      EOF

      # The installer supplies the validated host checkout through a writable
      # direct source device mounted over this target. This is an intentional
      # development-only mutability boundary.
      install -d -o qiln -g qiln -m 0755 /opt/qiln
      install -d -o root -g root -m 0755 /etc/qiln

      # The installer's Incus proxy device creates this root-owned directory.
      install -d -o root -g root -m 0755 /var/lib/incus

      # Host keys identify this orchestrator instance and must not be inherited
      # by every container created from this image.
      rm -f /etc/ssh/ssh_host_*

      # The deployed instance must initialize and use only its attached PostgreSQL volume.
      rm -rf /var/lib/postgresql/18/main

      # Update npm to an approved modern version
      npm install --global npm@12.2.2

  # Validate generated configuration while removing temporary validation host
  # keys so deployed instances still generate their own SSH identities.
  - trigger: post-files
    action: |-
      #!/bin/sh
      set -eux

      visudo -cf /etc/sudoers.d/90-qiln-orchestrator-admin

      chown root:postgres /etc/postgresql/18/main/pg_hba.conf
      chmod 0640 /etc/postgresql/18/main/pg_hba.conf
      runuser -u postgres -- test -r /etc/postgresql/18/main/pg_hba.conf

      install -d -o root -g root -m 0755 /run/sshd

      ssh-keygen -A
      /usr/sbin/sshd -t -f /etc/ssh/sshd_config
      rm -f /etc/ssh/ssh_host_*
      rmdir /run/sshd

      systemctl enable ssh.service
      systemctl enable caddy.service
      systemctl enable postgresql.service
      systemctl enable qiln-postgres-bootstrap.service
      systemctl enable qiln-instance-bootstrap.service
      systemctl enable nats-server.service

      systemctl disable qiln-dev.service
      systemctl disable qiln-ssh-dev.service

files:
  # Retain Ubuntu's welcome and operational notices, but omit generic help links.
  - path: /etc/update-motd.d/10-help-text
    generator: remove

  # Keep login guidance local and static so MOTD generation never reads
  # credentials, contacts services, or delays login on infrastructure probes.
  - path: /etc/update-motd.d/99-qiln
    generator: dump
    uid: 0
    gid: 0
    mode: '0755'
    content: |-
      #!/bin/sh
      cat <<'EOF'

      ▄█████▄ ██ ██     ███  ██
      ██   ██ ██ ██     ██ ▀▄██
      ▀█████▀ ██ ██████ ██   ██
        ▀▀▀ 

      Qiln · Development Orchestrator
      Versioned AI workflow capsules

      Paths
        Checkout       /opt/qiln
        Web config     /etc/qiln/runtime.env
        SSH config     /etc/qiln/ssh.env
        Ingress env    /run/qiln/ingress.env

      Services
        Status         systemctl status qiln-dev qiln-ssh-dev
        Logs           journalctl -u qiln-dev -u qiln-ssh-dev -f

      Manual development (from /opt/qiln, in separate terminals)
        Load ingress   set -a; . /run/qiln/ingress.env; set +a
        Web + Worker   npm run server:dev
        SSH build      npm run ssh:dev (qiln-ssh-dev runs the output)

      Development only image

      EOF

  # Incus/cloud-init image templates.
  - name: meta-data
    generator: cloud-init
  - name: network-config
    generator: cloud-init
  - name: user-data
    generator: cloud-init
  - name: vendor-data
    generator: cloud-init

  # Prevent cloned containers from sharing machine identity.
  - path: /etc/machine-id
    generator: dump
    content: ''

  - path: /var/lib/dbus/machine-id
    generator: remove

  # Cloud-init remains available for Incus NoCloud metadata, but SSH identity
  # and user provisioning belong to the image bootstrap rather than cloud-init.
  - path: /etc/cloud/cloud.cfg.d/99-qiln-orchestrator.cfg
    generator: dump
    uid: 0
    gid: 0
    mode: '0644'
    content: |-
      users: []
      ssh_pwauth: false
      ssh_deletekeys: false
      ssh_genkeytypes: []
      ssh_quiet_keygen: true
      ssh_publish_hostkeys:
        enabled: false
      ssh:
        emit_keys_to_console: false

  # Basic DHCP networking for the control-plane container.
  - path: /etc/netplan/10-incus.yaml
    generator: dump
    content: |-
      network:
        version: 2
        ethernets:
          eth0:
            dhcp4: true
            dhcp-identifier: mac

  # Pin NodeSource Node.js packages to avoid accidental repository pollution.
  - path: /etc/apt/preferences.d/nodejs
    generator: dump
    mode: '0644'
    content: |-
      Package: nodejs
      Pin: origin deb.nodesource.com
      Pin-Priority: 600

  # PostgreSQL accepts TCP only on loopback and always reads mutable cluster
  # state from the attached persistent volume.
  - path: /etc/postgresql/18/main/conf.d/60-qiln-local.conf
    generator: dump
    uid: 0
    gid: 0
    mode: '0644'
    content: |-
      data_directory = '/var/lib/postgresql/18/main'
      listen_addresses = '127.0.0.1'
      unix_socket_directories = '/var/run/postgresql'
      password_encryption = 'scram-sha-256'

  # PostgreSQL administration and Qiln application access use local peer
  # authentication. The Web and SSH roles each match the operating-system user
  # of the same name, and the SSH role's privileges are limited by
  # app/server/db/grants.ts. TCP clients must use SCRAM credentials explicitly
  # created outside this image.
  - path: /etc/postgresql/18/main/pg_hba.conf
    generator: dump
    uid: 0
    gid: 0
    mode: '0640'
    content: |-
      local   all             postgres                                peer
      local   qiln            qiln,qiln-ssh                           peer
      local   all             all                                     reject
      host    all             all             127.0.0.1/32            scram-sha-256
      host    all             all             ::1/128                 scram-sha-256

  # The PostgreSQL data directory must be an attached Incus volume. A new
  # volume is initialized once, while existing volumes are validated and reused.
  - path: /usr/local/sbin/qiln-postgres-volume-init
    generator: dump
    uid: 0
    gid: 0
    mode: '0755'
    content: |-
      #!/bin/sh
      set -eu

      POSTGRES_VOLUME='/var/lib/postgresql'
      POSTGRES_VERSION='18'
      POSTGRES_PARENT="${POSTGRES_VOLUME}/${POSTGRES_VERSION}"
      PGDATA="${POSTGRES_PARENT}/main"
      INITDB="/usr/lib/postgresql/${POSTGRES_VERSION}/bin/initdb"

      if [ -L "${POSTGRES_VOLUME}" ] || [ ! -d "${POSTGRES_VOLUME}" ]; then
        echo 'PostgreSQL persistent storage path must be a directory and cannot be a symbolic link.' >&2
        exit 1
      fi

      if ! /usr/bin/mountpoint --quiet "${POSTGRES_VOLUME}"; then
        echo 'PostgreSQL persistent storage volume is not mounted at /var/lib/postgresql.' >&2
        exit 1
      fi

      if [ -L "${POSTGRES_PARENT}" ]; then
        echo 'PostgreSQL version directory cannot be a symbolic link.' >&2
        exit 1
      fi

      if [ -L "${PGDATA}" ]; then
        echo 'PostgreSQL data directory cannot be a symbolic link.' >&2
        exit 1
      fi

      chown postgres:postgres "${POSTGRES_VOLUME}"
      chmod 0755 "${POSTGRES_VOLUME}"
      install -d -o postgres -g postgres -m 0755 "${POSTGRES_PARENT}"

      if [ ! -e "${PGDATA}" ]; then
        install -d -o postgres -g postgres -m 0700 "${PGDATA}"
      elif [ ! -d "${PGDATA}" ]; then
        echo 'PostgreSQL data path exists but is not a directory.' >&2
        exit 1
      fi

      if [ ! -e "${PGDATA}/PG_VERSION" ]; then
        if [ -n "$(find "${PGDATA}" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
          echo 'PostgreSQL data directory is non-empty but has no PG_VERSION file.' >&2
          exit 1
        fi

        chown postgres:postgres "${PGDATA}"
        chmod 0700 "${PGDATA}"

        /usr/sbin/runuser -u postgres -- "${INITDB}" \
          --pgdata="${PGDATA}" \
          --encoding=UTF8 \
          --locale=en_US.UTF-8 \
          --auth-local=peer \
          --auth-host=scram-sha-256
      fi

      if [ ! -f "${PGDATA}/PG_VERSION" ] || [ -L "${PGDATA}/PG_VERSION" ]; then
        echo 'PostgreSQL data directory has an invalid PG_VERSION file.' >&2
        exit 1
      fi

      if [ "$(cat "${PGDATA}/PG_VERSION")" != "${POSTGRES_VERSION}" ]; then
        echo 'PostgreSQL data volume belongs to an incompatible PostgreSQL major version.' >&2
        exit 1
      fi

      if [ "$(stat --format='%U:%G' "${PGDATA}")" != 'postgres:postgres' ]; then
        echo 'PostgreSQL data directory must be owned by postgres:postgres.' >&2
        exit 1
      fi

      case "$(stat --format='%a' "${PGDATA}")" in
        700|750)
          ;;
        *)
          echo 'PostgreSQL data directory permissions must be 0700 or 0750.' >&2
          exit 1
          ;;
      esac

      for required_directory in base global pg_wal; do
        if [ ! -d "${PGDATA}/${required_directory}" ] || [ -L "${PGDATA}/${required_directory}" ]; then
          echo "PostgreSQL data directory is missing required directory ${required_directory}." >&2
          exit 1
        fi
      done

  - path: /etc/systemd/system/qiln-postgres-volume-init.service
    generator: dump
    uid: 0
    gid: 0
    mode: '0644'
    content: |-
      [Unit]
      Description=Initialize or validate the persistent Qiln PostgreSQL volume
      After=local-fs.target
      Before=postgresql@18-main.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/qiln-postgres-volume-init
      RemainAfterExit=yes

  # PostgreSQL cannot start unless the dedicated persistent volume has been
  # initialized or validated successfully.
  - path: /etc/systemd/system/postgresql@18-main.service.d/qiln-volume.conf
    generator: dump
    uid: 0
    gid: 0
    mode: '0644'
    content: |-
      [Unit]
      Requires=qiln-postgres-volume-init.service
      After=qiln-postgres-volume-init.service

  # The bootstrap script creates only the local application roles and database.
  # It intentionally does not run Qiln migrations or grant table privileges,
  # because both belong to the deployed application revision, not the reusable
  # operating-system image.
  - path: /usr/local/sbin/qiln-postgres-bootstrap
    generator: dump
    uid: 0
    gid: 0
    mode: '0755'
    content: |-
      #!/bin/sh
      set -eu

      POSTGRES_RUNUSER='/usr/sbin/runuser -u postgres --'
      PSQL='/usr/bin/psql --dbname=postgres --no-align --tuples-only --set=ON_ERROR_STOP=1'

      if ! ${POSTGRES_RUNUSER} /usr/bin/pg_isready --quiet --host=/var/run/postgresql --port=5432 --dbname=postgres; then
        echo 'PostgreSQL is not ready for Qiln bootstrap.' >&2
        exit 1
      fi

      # Both application roles are unprivileged and have no password. Local peer
      # authentication binds each one to the operating-system user of the same name.
      ensure_role() {
        role_name=$1
        role_attributes="$(${POSTGRES_RUNUSER} ${PSQL} --command "SELECT rolsuper::text || '|' || rolcreatedb::text || '|' || rolcreaterole::text || '|' || rolreplication::text || '|' || rolbypassrls::text || '|' || rolcanlogin::text || '|' || rolinherit::text FROM pg_roles WHERE rolname = '${role_name}'")"

        case "${role_attributes}" in
          '')
            ${POSTGRES_RUNUSER} ${PSQL} --command "CREATE ROLE \"${role_name}\" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT"
            ;;
          'false|false|false|false|false|true|false')
            ;;
          *)
            echo "Existing PostgreSQL role ${role_name} has unexpected privileges or login attributes" >&2
            exit 1
            ;;
        esac
      }

      ensure_role qiln
      ensure_role qiln-ssh

      database_owner="$(${POSTGRES_RUNUSER} ${PSQL} --command "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'qiln'")"

      case "${database_owner}" in
        '')
          ${POSTGRES_RUNUSER} /usr/bin/createdb --owner=qiln --encoding=UTF8 --template=template0 qiln
          ;;
        'qiln')
          ;;
        *)
          echo 'Existing PostgreSQL database qiln has an unexpected owner.' >&2
          exit 1
          ;;
      esac

      ${POSTGRES_RUNUSER} ${PSQL} --command "REVOKE ALL ON DATABASE qiln FROM PUBLIC"

  # PostgreSQL role and database creation remains separate from cluster volume
  # initialization because it requires a running PostgreSQL server.
  - path: /etc/systemd/system/qiln-postgres-bootstrap.service
    generator: dump
    uid: 0
    gid: 0
    mode: '0644'
    content: |-
      [Unit]
      Description=Initialize the local Qiln PostgreSQL roles and database
      Requires=postgresql@18-main.service
      After=postgresql@18-main.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/qiln-postgres-bootstrap
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

  # One root-owned prerequisite owns this concrete orchestrator's SSH host
  # identity and administrator roster. It also materializes the development
  # shell Host credential, the non-secret ingress overlay, and a root-only,
  # NATS-only credential for the SSH authority. The SSH credential is derived
  # from the Host credential so the installer's credential set stays unchanged.
  # systemd services import their own private copies of their credentials and
  # read the shared overlay.
  #
  # TODO(ssh-credential): Delete the derivation once the installer delivers an
  # SSH-only credential directly.
  - path: /usr/local/sbin/qiln-instance-bootstrap
    generator: dump
    uid: 0
    gid: 0
    mode: '0755'
    content: |-
      #!/bin/sh
      set -eu

      umask 077

      readonly runtime_directory='/run/qiln'
      readonly host_environment_path='/run/qiln/qiln-host.env'
      readonly ingress_environment_path='/run/qiln/ingress.env'
      readonly ssh_environment_path='/run/qiln/qiln-ssh.env'
      readonly home_directory='/home/qiln'
      readonly ssh_directory='/home/qiln/.ssh'
      readonly authorized_keys_path='/home/qiln/.ssh/authorized_keys'

      # The ingress keys must stay in step with the overlay that
      # `qiln installation configure` generates.
      readonly host_environment_keys='NATS_TOKEN FASTIFY_COOKIE_SECRET'
      readonly ingress_environment_keys='QILN_DEV_PUBLIC_ORIGIN QILN_ROUTING_PUBLIC_ORIGIN QILN_ROUTE_BASE_DOMAIN QILN_SSH_PUBLIC_HOST QILN_SSH_PUBLIC_PORT'

      credential_directory="${CREDENTIALS_DIRECTORY:-}"
      environment_temporary_path=''
      authorized_keys_temporary_path=''
      roster_validation_path=''
      carriage_return="$(printf '\r')"
      ssh_keygen_output=''

      fail() {
        echo "$1" >&2
        exit 1
      }

      cleanup() {
        if [ -n "${environment_temporary_path}" ]; then
          rm -f -- "${environment_temporary_path}" || true
        fi
        if [ -n "${authorized_keys_temporary_path}" ]; then
          rm -f -- "${authorized_keys_temporary_path}" || true
        fi
        if [ -n "${roster_validation_path}" ]; then
          rm -f -- "${roster_validation_path}" || true
        fi
      }

      trap cleanup 0
      trap 'exit 1' HUP INT TERM

      validate_regular_file() {
        file_path=$1
        file_description=$2

        if [ -L "${file_path}" ] || [ ! -f "${file_path}" ] || [ ! -r "${file_path}" ]; then
          fail "${file_description} must be a readable regular non-symlink file."
        fi
      }

      validate_owned_directory() {
        directory_path=$1
        expected_owner=$2
        directory_description=$3

        if [ -L "${directory_path}" ] || [ ! -d "${directory_path}" ]; then
          fail "${directory_description} must be a non-symlink directory."
        fi

        if [ "$(stat --format='%u:%g' "${directory_path}")" != "${expected_owner}" ]; then
          fail "${directory_description} must be owned by ${expected_owner}."
        fi
      }

      validate_materialized_destination() {
        destination_path=$1
        destination_description=$2

        if [ -L "${destination_path}" ] || { [ -e "${destination_path}" ] && [ ! -f "${destination_path}" ]; }; then
          fail "${destination_description} must be absent or a regular non-symlink file."
        fi
      }

      validate_credential_directory() {
        if [ -z "${credential_directory}" ] || [ -L "${credential_directory}" ] || [ ! -d "${credential_directory}" ]; then
          fail 'Systemd credential directory is unavailable or invalid.'
        fi
      }

      validate_safe_dotenv_value() {
        dotenv_value=$1
        dotenv_name=$2

        case "${dotenv_value}" in
          ''|*[!A-Za-z0-9._+/@:=%-]*)
            fail "Dotenv value ${dotenv_name} is empty or contains unsupported characters."
            ;;
        esac
      }

      # Accepts exactly one assignment of every expected key and nothing else.
      validate_environment() {
        environment_source_path=$1
        environment_description=$2
        expected_keys=$3
        seen_keys=' '
        environment_line=''
        environment_key=''
        environment_value=''

        validate_regular_file "${environment_source_path}" "${environment_description}"

        while IFS= read -r environment_line || [ -n "${environment_line}" ]; do
          case "${environment_line}" in
            *"${carriage_return}"*)
              fail "${environment_description} must not contain carriage returns."
              ;;
            ''|'#'*)
              continue
              ;;
          esac

          environment_key=''
          for expected_key in ${expected_keys}; do
            case "${environment_line}" in
              "${expected_key}="*)
                environment_key=${expected_key}
                ;;
            esac
          done
          if [ -z "${environment_key}" ]; then
            fail "${environment_description} may contain only ${expected_keys} assignments."
          fi

          case "${seen_keys}" in
            *" ${environment_key} "*)
              fail "${environment_description} must not define ${environment_key} more than once."
              ;;
          esac

          environment_value=${environment_line#"${environment_key}="}
          validate_safe_dotenv_value "${environment_value}" "${environment_key}"
          seen_keys="${seen_keys}${environment_key} "
        done < "${environment_source_path}"

        for expected_key in ${expected_keys}; do
          case "${seen_keys}" in
            *" ${expected_key} "*)
              ;;
            *)
              fail "${environment_description} must contain ${expected_key}."
              ;;
          esac
        done
      }

      validate_authorized_keys_roster() {
        roster_path=$1
        roster_line=''
        trimmed_roster_line=''
        roster_line_number=0
        public_key_count=0

        roster_validation_path="$(mktemp /tmp/qiln-orchestrator-authorized-key.XXXXXX)"

        while IFS= read -r roster_line || [ -n "${roster_line}" ]; do
          roster_line_number=$((roster_line_number + 1))

          case "${roster_line}" in
            *"${carriage_return}"*)
              fail "Orchestrator SSH authorized-key roster contains a carriage return at line ${roster_line_number}."
              ;;
          esac

          trimmed_roster_line="$(printf '%s' "${roster_line}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          case "${trimmed_roster_line}" in
            ''|'#'*)
              continue
              ;;
          esac

          printf '%s\n' "${roster_line}" > "${roster_validation_path}"
          if ! ssh-keygen -l -f "${roster_validation_path}" >/dev/null 2>&1; then
            fail "Orchestrator SSH authorized-key roster contains an invalid public key at line ${roster_line_number}."
          fi

          public_key_count=$((public_key_count + 1))
        done < "${roster_path}"

        if [ "${public_key_count}" -eq 0 ]; then
          fail 'Orchestrator SSH authorized-key roster must contain at least one valid public key.'
        fi

        rm -f -- "${roster_validation_path}"
        roster_validation_path=''
      }

      ensure_runtime_directory() {
        if [ -L "${runtime_directory}" ]; then
          fail 'Qiln runtime credential directory must not be a symbolic link.'
        fi

        if [ ! -e "${runtime_directory}" ]; then
          install -d -o root -g qiln -m 0710 -- "${runtime_directory}"
        fi

        if [ -L "${runtime_directory}" ] || [ ! -d "${runtime_directory}" ]; then
          fail 'Qiln runtime credential directory must be a non-symlink directory.'
        fi

        chown root:qiln "${runtime_directory}"
        chmod 0710 "${runtime_directory}"

        if [ "$(stat --format='%u:%g:%a' "${runtime_directory}")" != '0:1000:710' ]; then
          fail 'Qiln runtime credential directory must be owned by root:qiln with mode 0710.'
        fi
      }

      ensure_ssh_directory() {
        validate_owned_directory "${home_directory}" '1000:1000' 'Qiln home directory'

        if [ -L "${ssh_directory}" ]; then
          fail 'Qiln SSH directory must not be a symbolic link.'
        fi

        if [ ! -e "${ssh_directory}" ]; then
          install -d -o qiln -g qiln -m 0700 -- "${ssh_directory}"
        fi

        if [ -L "${ssh_directory}" ] || [ ! -d "${ssh_directory}" ]; then
          fail 'Qiln SSH directory must be a non-symlink directory.'
        fi

        chown qiln:qiln "${ssh_directory}"
        chmod 0700 "${ssh_directory}"

        if [ "$(stat --format='%u:%g:%a' "${ssh_directory}")" != '1000:1000:700' ]; then
          fail 'Qiln SSH directory must be owned by qiln:qiln with mode 0700.'
        fi
      }

      write_environment() {
        environment_source_path=$1
        environment_destination_path=$2
        environment_description=$3

        validate_materialized_destination "${environment_destination_path}" "Materialized ${environment_description}"

        environment_temporary_path="$(mktemp "${runtime_directory}/.qiln-environment.XXXXXX")"
        cat "${environment_source_path}" > "${environment_temporary_path}"

        chown root:qiln "${environment_temporary_path}"
        chmod 0640 "${environment_temporary_path}"

        if [ "$(stat --format='%u:%g:%a' "${environment_temporary_path}")" != '0:1000:640' ]; then
          fail "Materialized ${environment_description} must be owned by root:qiln with mode 0640."
        fi

        mv -f -- "${environment_temporary_path}" "${environment_destination_path}"
        environment_temporary_path=''
      }

      write_ssh_environment() {
        validate_materialized_destination "${ssh_environment_path}" 'Materialized Qiln SSH credential dotenv'

        environment_temporary_path="$(mktemp "${runtime_directory}/.qiln-environment.XXXXXX")"
        grep '^NATS_TOKEN=' "${host_environment_credential_path}" > "${environment_temporary_path}"

        mv -f -- "${environment_temporary_path}" "${ssh_environment_path}"
        environment_temporary_path=''
      }

      write_authorized_keys() {
        validate_materialized_destination "${authorized_keys_path}" 'Materialized orchestrator authorized-key roster'

        authorized_keys_temporary_path="$(mktemp "${ssh_directory}/.authorized_keys.qiln.XXXXXX")"
        cat "${orchestrator_authorized_keys_credential_path}" > "${authorized_keys_temporary_path}"

        chown qiln:qiln "${authorized_keys_temporary_path}"
        chmod 0600 "${authorized_keys_temporary_path}"
        mv -f -- "${authorized_keys_temporary_path}" "${authorized_keys_path}"
        authorized_keys_temporary_path=''
      }

      # Suppress normal generation output, but retain diagnostics on failure.
      if ! ssh_keygen_output="$(/usr/bin/ssh-keygen -A 2>&1)"; then
        if [ -n "${ssh_keygen_output}" ]; then
          printf '%s\n' "${ssh_keygen_output}" >&2
        fi
        fail 'Failed to generate missing SSH host keys.'
      fi

      validate_credential_directory

      readonly host_environment_credential_path="${credential_directory}/qiln-host.env"
      readonly ingress_environment_credential_path="${credential_directory}/qiln-ingress.env"
      readonly orchestrator_authorized_keys_credential_path="${credential_directory}/qiln-orchestrator-authorized-keys"

      validate_regular_file "${orchestrator_authorized_keys_credential_path}" 'Orchestrator SSH authorized-key credential'
      validate_environment "${host_environment_credential_path}" 'Qiln Host credential dotenv' "${host_environment_keys}"
      validate_environment "${ingress_environment_credential_path}" 'Qiln ingress credential dotenv' "${ingress_environment_keys}"
      validate_authorized_keys_roster "${orchestrator_authorized_keys_credential_path}"
      ensure_runtime_directory
      ensure_ssh_directory
      write_environment "${host_environment_credential_path}" "${host_environment_path}" 'Qiln Host credential dotenv'
      write_environment "${ingress_environment_credential_path}" "${ingress_environment_path}" 'Qiln ingress credential dotenv'
      write_ssh_environment
      write_authorized_keys

