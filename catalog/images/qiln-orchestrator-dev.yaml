image:
  distribution: ubuntu
  release: noble
  architecture: amd64
  description: 'Qiln Orchestrator Image (Node.js v22 / Caddy)'

source:
  downloader: debootstrap
  url: http://archive.ubuntu.com/ubuntu
  keyserver: keyserver.ubuntu.com
  keys:
    - 0xF6ECB3762474EDA9D21B7022871920D1991BC93C # Ubuntu Archive Automatic Signing Key (2018)

packages:
  manager: apt
  update: true
  cleanup: true
  sets:
    - packages:
        # Early Packages
        - ca-certificates
        - curl
        - gnupg
      action: install
      early: true

    - packages:
        # Minimum base needed for an Incus systemd container with DHCP networking
        - systemd
        - systemd-sysv
        - netplan.io
        - iproute2
        - locales
        - vim
        # Qiln control-plane runtime primitives
        - nodejs
        - caddy
      action: install

  repositories:
    # Standard Ubuntu repositories
    - name: sources.list
      url: |-
        deb http://archive.ubuntu.com/ubuntu {{ image.release }} main restricted universe multiverse
        deb http://archive.ubuntu.com/ubuntu {{ image.release }}-updates main restricted universe multiverse
        deb http://security.ubuntu.com/ubuntu {{ image.release }}-security main restricted universe multiverse
    # NodeSource Node.js v22 repository
    - name: nodesource.list
      url: |-
        deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main
    # Official Caddy stable repository
    - name: caddy-stable.list
      url: |-
        deb [signed-by=/etc/apt/keyrings/caddy-stable.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main

actions:
  # Bootstrap repository keyrings before package installation
  - trigger: post-unpack
    action: |-
      #!/bin/sh
      set -eux

      mkdir -p /etc/apt/keyrings
      chmod 755 /etc/apt/keyrings

      curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
      chmod 644 /etc/apt/keyrings/nodesource.gpg

      curl -fsSL https://dl.cloudsmith.io/public/caddy/stable/gpg.key | gpg --dearmor -o /etc/apt/keyrings/caddy-stable.gpg
      chmod 644 /etc/apt/keyrings/caddy-stable.gpg

  # Control-plane user, locale, and minimal Qiln runtime path preparation
  - trigger: post-packages
    action: |-
      #!/bin/sh
      set -eux

      locale-gen en_US.UTF-8
      update-locale LANG=en_US.UTF-8

      groupadd -g 1000 qiln
      useradd -u 1000 -g 1000 -m -s /bin/bash -d /home/qiln qiln

      mkdir -p /opt/qiln/bin
      chown -R qiln:qiln /opt/qiln

      mkdir -p /etc/systemd/system/caddy.service.d

      npm install -g npm@11.15.0

  # Validate files generated by the image definition after they have been written
  - trigger: post-files
    action: |-
      #!/bin/sh
      set -eux

      caddy validate --config /etc/caddy/qiln.json

files:
  # Incus/cloud-init image templates
  - name: meta-data
    generator: cloud-init
  - name: network-config
    generator: cloud-init
  - name: user-data
    generator: cloud-init
  - name: vendor-data
    generator: cloud-init

  # Set hostname and hosts
  - path: /etc/hostname
    generator: dump
    content: |-
      qiln

  - path: /etc/hosts
    generator: dump
    content: |-
      127.0.0.1 localhost

      ::1 localhost ip6-localhost ip6-loopback
      ff02::1 ip6-allnodes
      ff02::2 ip6-allrouters

  # Prevent cloned containers from sharing machine identity
  - path: /etc/machine-id
    generator: dump
    content: ''

  - path: /var/lib/dbus/machine-id
    generator: remove

  # Basic DHCP networking for the control-plane container
  - path: /etc/netplan/10-incus.yaml
    generator: dump
    content: |-
      network:
        version: 2
        ethernets:
          eth0:
            dhcp4: true
            dhcp-identifier: mac

  # Pin NodeSource Node.js packages to avoid accidental repository pollution
  - path: /etc/apt/preferences.d/nodejs
    generator: dump
    content: |-
      Package: nodejs
      Pin: origin deb.nodesource.com
      Pin-Priority: 600

  # Caddyfile is obsolete because Qiln owns a native JSON route array with a
  # stable server name and terminal fallback boundary.
  - path: /etc/caddy/Caddyfile
    generator: remove

  # Qiln Caddy starts from this exact native JSON route-array boundary.
  - path: /etc/caddy/qiln.json
    generator: dump
    mode: '0644'
    content: |-
      {
        "admin": {
          "listen": ":2019"
        },
        "apps": {
          "http": {
            "servers": {
              "qiln": {
                "listen": [":8080"],
                "routes": [
                  {
                    "@id": "qiln-route-fallback-experimental",
                    "handle": [
                      {
                        "handler": "static_response",
                        "status_code": 404
                      }
                    ],
                    "terminal": true
                  }
                ]
              }
            }
          }
        }
      }

  - path: /etc/systemd/system/caddy.service.d/qiln-json.conf
    generator: dump
    mode: '0644'
    content: |-
      [Service]
      ExecStart=
      ExecStart=/usr/bin/caddy run --environ --config /etc/caddy/qiln.json
      ExecReload=
