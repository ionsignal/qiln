image:
  distribution: ubuntu
  release: resolute
  architecture: amd64
  description: 'Qiln Builder Image (Distrobuilder / Seed Volume Maintenance)'

source:
  downloader: debootstrap
  url: https://archive.ubuntu.com/ubuntu
  keyserver: keyserver.ubuntu.com
  keys:
    - 0xF6ECB3762474EDA9D21B7022871920D1991BC93C # Ubuntu Archive Automatic Signing Key (2018)

packages:
  manager: apt
  update: true
  cleanup: true
  sets:
    - packages:
        # Bootstrap tools needed before the full package set is available.
        - ca-certificates
        - curl
        - gnupg
      action: install
      early: true

    - packages:
        # Container and cloud-init runtime.
        - systemd
        - systemd-sysv
        - netplan.io
        - iproute2
        - locales
        - cloud-init
        # General builder and seed-maintenance tools.
        - vim
        - git
        - rsync
        - tar
        - gzip
        - bzip2
        - unzip
        - zstd
        - xz-utils
        # Rootfs and image-construction dependencies.
        - debootstrap
        - squashfs-tools
        - squashfuse
        # Distrobuilder is installed from Snap on first boot.
        - snapd
      action: install

  repositories:
    - name: sources.list
      url: |-
        deb https://archive.ubuntu.com/ubuntu {{ image.release }} main restricted universe multiverse
        deb https://archive.ubuntu.com/ubuntu {{ image.release }}-updates main restricted universe multiverse
        deb https://security.ubuntu.com/ubuntu {{ image.release }}-security main restricted universe multiverse

actions:
  - trigger: post-packages
    action: |-
      #!/bin/sh
      set -eux

      locale-gen en_US.UTF-8
      update-locale LANG=en_US.UTF-8

      # This is general builder output, distinct from the instance-local
      # seed-workspace mount used to edit future capsule branch baselines.
      mkdir -p /workspace

      DAGGER_VERSION='1.0.0-beta.13'
      DAGGER_ARCHIVE="dagger_v${DAGGER_VERSION}_linux_amd64.tar.gz"
      DAGGER_RELEASE_URL="https://dl.dagger.io/dagger/releases/${DAGGER_VERSION}"

      dagger_tmpdir="$(mktemp -d)"
      trap 'rm -rf -- "${dagger_tmpdir}"' 0
      trap 'exit 1' HUP INT TERM

      curl --fail --show-error --silent --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
        "${DAGGER_RELEASE_URL}/${DAGGER_ARCHIVE}" \
        --output "${dagger_tmpdir}/${DAGGER_ARCHIVE}"

      # Match the upstream installer's checksum source while selecting exactly
      # one checksum for the pinned archive before extraction.
      curl --fail --show-error --silent --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
        "${DAGGER_RELEASE_URL}/checksums.txt" \
        --output "${dagger_tmpdir}/checksums.txt"

      (
        cd "${dagger_tmpdir}"

        awk -v archive="${DAGGER_ARCHIVE}" '
          $2 == archive || $2 == "*" archive {
            if (length($1) != 64 || $1 ~ /[^0-9a-fA-F]/) {
              invalid = 1
            }
            print $1 "  " archive
            matches++
          }
          END {
            if (matches != 1 || invalid) {
              exit 1
            }
          }
        ' checksums.txt > dagger.sha256

        sha256sum --check --strict dagger.sha256
        tar --no-same-owner -xzf "${DAGGER_ARCHIVE}" dagger
      )

      install -d -m 0755 /usr/local/bin
      install -o root -g root -m 0755 "${dagger_tmpdir}/dagger" /usr/local/bin/dagger
      /usr/local/bin/dagger version --quiet

      rm -rf -- "${dagger_tmpdir}"
      trap - 0 HUP INT TERM

files:
  # Incus/cloud-init image templates.
  - name: meta-data
    generator: cloud-init
  - name: network-config
    generator: cloud-init
  - name: user-data
    generator: cloud-init
  - name: vendor-data
    generator: cloud-init

  # Prevent derived builder instances from sharing machine identity.
  - path: /etc/machine-id
    generator: dump
    content: ''

  - path: /var/lib/dbus/machine-id
    generator: remove

  # Builder networking remains profile-independent and uses the Incus NIC.
  - path: /etc/netplan/10-incus.yaml
    generator: dump
    content: |-
      network:
        version: 2
        ethernets:
          eth0:
            dhcp4: true
            dhcp-identifier: mac

  # Distrobuilder remains a first-boot installation because it is distributed
  # as a classic Snap rather than an APT package.
  - path: /var/lib/cloud/scripts/per-instance/qiln-install-distrobuilder
    generator: dump
    mode: '0755'
    content: |-
      #!/bin/sh
      set -eu

      snap install distrobuilder --classic
