schema_version: 1
name: comfyui-capsule
display_name: AI Workflow Capsule (ComfyUI)
description: ComfyUI capsule with versioned app and data storage, fresh branch outputs, and a read-only shared model vault.
image_alias: qiln-noble-python-node

provisioning:
  volumes:
    - name: app
      type: clone
      versioned: true
      pool: is-nvme-pool
      source_volume: qiln-comfyui-dev
      mount_path: /workspace/app
      shifted: true
      readonly: false
    - name: data
      type: empty
      versioned: true
      pool: is-nvme-pool
      mount_path: /workspace/data
      shifted: true
      readonly: false
    - name: outputs
      type: empty
      versioned: false
      pool: is-nvme-pool
      mount_path: /workspace/outputs
      shifted: true
      readonly: false
    - name: models-shared
      type: clone
      versioned: true
      pool: is-nvme-pool
      source_volume: is-model-vault
      mount_path: /workspace/models/shared
      shifted: true
      readonly: true
    - name: models-private
      type: empty
      versioned: true
      pool: is-nvme-pool
      mount_path: /workspace/models/private
      shifted: true
      readonly: false

  files:
    - path: /workspace
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/data/input
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/data/user
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/data/config
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    # Parent directory on the instance rootfs. The two child paths are mount
    # targets and are supplied by Incus disk devices.
    - path: /workspace/models
      type: directory
      uid: 0
      gid: 0
      mode: '0755'

    # These paths resolve into the writable models-private volume.
    - path: /workspace/models/private/checkpoints
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/models/private/loras
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/models/private/vae
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/data/capsule
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/data/capsule/workflows
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/data/capsule/routes
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/data/capsule/tests
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/data/capsule/shared
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    # The systemd launcher passes this configuration explicitly. Custom nodes
    # and API nodes remain disabled for the initial GPU-enabled smoke path.
    - path: /workspace/data/config/extra_model_paths.yaml
      uid: 1000
      gid: 1000
      mode: '0644'
      content: |
        qiln_shared_models:
          base_path: /workspace/models/shared
          checkpoints: checkpoints/
          loras: loras/
          vae: vae/
        qiln_private_models:
          base_path: /workspace/models/private
          checkpoints: checkpoints/
          loras: loras/
          vae: vae/

    # Create installs this unit offline. Cloud-init only prepares ownership;
    # systemd owns application startup on the first and subsequent branch boots.
    - path: /etc/systemd/system/qiln-comfyui.service
      uid: 0
      gid: 0
      mode: '0644'
      content: |
        [Unit]
        Description=Qiln ComfyUI branch runtime
        RequiresMountsFor=/workspace/app /workspace/data /workspace/outputs /workspace/models/shared /workspace/models/private
        StartLimitIntervalSec=300
        StartLimitBurst=5

        [Service]
        Type=simple
        User=qiln
        Group=qiln
        WorkingDirectory=/workspace/app
        Environment=PYTHONUNBUFFERED=1
        ExecStartPre=/usr/bin/mountpoint --quiet /workspace/app
        ExecStartPre=/usr/bin/mountpoint --quiet /workspace/data
        ExecStartPre=/usr/bin/mountpoint --quiet /workspace/outputs
        ExecStartPre=/usr/bin/mountpoint --quiet /workspace/models/shared
        ExecStartPre=/usr/bin/mountpoint --quiet /workspace/models/private
        ExecStartPre=/usr/bin/test -x /workspace/app/.venv/bin/python
        ExecStartPre=/usr/bin/test -r /workspace/app/main.py
        ExecStartPre=/usr/bin/test -r /workspace/data/config/extra_model_paths.yaml
        ExecStartPre=/usr/bin/test -w /workspace/data/input
        ExecStartPre=/usr/bin/test -w /workspace/data/user
        ExecStartPre=/usr/bin/test -w /workspace/outputs
        ExecStart=/workspace/app/.venv/bin/python /workspace/app/main.py \
          --listen 0.0.0.0 \
          --port 8188 \
          --models-directory /workspace/models/private \
          --extra-model-paths-config /workspace/data/config/extra_model_paths.yaml \
          --input-directory /workspace/data/input \
          --user-directory /workspace/data/user \
          --output-directory /workspace/outputs \
          --temp-directory /workspace/outputs \
          --disable-all-custom-nodes \
          --disable-api-nodes
        Restart=on-failure
        RestartSec=10
        TimeoutStopSec=60

    - path: /etc/systemd/system/multi-user.target.d
      type: directory
      uid: 0
      gid: 0
      mode: '0755'

    # Pull in the service without booting the container to run systemctl enable.
    - path: /etc/systemd/system/multi-user.target.d/90-qiln-comfyui.conf
      uid: 0
      gid: 0
      mode: '0644'
      content: |
        [Unit]
        Wants=qiln-comfyui.service

runtime:
  config:
    security.privileged: 'false'
    security.nesting: 'false'
    nvidia.runtime: 'true'
    boot.autostart: 'false'
    limits.kernel.memlock: unlimited

  devices:
    eth0:
      type: nic
      network: incusbr0
      security.ipv4_filtering: 'true'
      security.mac_filtering: 'true'
    root:
      type: disk
      pool: is-nvme-pool
      path: /
    # Static assignment is not a lease or an exclusivity guarantee. Operators
    # must keep all other ComfyUI branches using this GPU stopped.
    gpu0:
      type: gpu
      gputype: physical
      pci: '0000:03:00.0'

snapshot:
  policy_version: 1
  instance_rootfs:
    mode: rebuildable

applications:
  - name: comfyui
    port: 8188
    protocol: http
    entrypoint: /
    exposure: proxy
    endpoint:
      mode: passthrough
    verification:
      method: GET
      path: /
      expected_statuses:
        - 200
