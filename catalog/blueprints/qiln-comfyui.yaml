schema_version: 1

name: comfyui-capsule
display_name: AI Workflow Capsule (ComfyUI)
description: ComfyUI capsule with versioned app and data storage, fresh branch outputs, and a read-only shared model vault.
image_alias: qiln-noble-python-node

provisioning:
  volumes:
    - name: app
      type: clone
      versioned: true
      pool: is-nvme-pool
      source_volume: qiln-comfyui-dev
      mount_path: /workspace/app
      shifted: true
      readonly: false
    - name: data
      type: empty
      versioned: true
      pool: is-nvme-pool
      mount_path: /workspace/data
      shifted: true
      readonly: false
    - name: outputs
      type: empty
      versioned: false
      pool: is-nvme-pool
      mount_path: /workspace/outputs
      shifted: true
      readonly: false
    - name: models-shared
      type: clone
      versioned: true
      pool: is-nvme-pool
      source_volume: is-model-vault
      mount_path: /workspace/models/shared
      shifted: true
      readonly: true
    - name: models-private
      type: empty
      versioned: true
      pool: is-nvme-pool
      mount_path: /workspace/models/private
      shifted: true
      readonly: false

  files:
    - path: /workspace
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/data/input
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/data/user
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/data/config
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    # Parent directory on the instance rootfs. The two child paths are mount
    # targets and are supplied by Incus disk devices.
    - path: /workspace/models
      type: directory
      uid: 0
      gid: 0
      mode: '0755'

    # These paths resolve into the writable models-private volume.
    - path: /workspace/models/private/checkpoints
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/models/private/loras
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/models/private/vae
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    # The future ComfyUI launcher must pass this file explicitly through
    # ComfyUI's extra-model-path configuration option. Custom-node discovery
    # must separately resolve /workspace/app/custom_nodes.
    - path: /workspace/data/config/extra_model_paths.yaml
      uid: 1000
      gid: 1000
      mode: '0644'
      content: |
        qiln_shared_models:
          base_path: /workspace/models/shared
          checkpoints: checkpoints/
          loras: loras/
          vae: vae/

        qiln_private_models:
          base_path: /workspace/models/private
          checkpoints: checkpoints/
          loras: loras/
          vae: vae/

    - path: /workspace/data/capsule
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/data/capsule/workflows
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/data/capsule/routes
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/data/capsule/tests
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/data/capsule/shared
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

runtime:
  config:
    security.privileged: 'false'
    security.nesting: 'false'
    nvidia.runtime: 'true'
    boot.autostart: 'false'
    limits.kernel.memlock: unlimited

  devices:
    eth0:
      type: nic
      network: incusbr0
      security.ipv4_filtering: 'true'
      security.mac_filtering: 'true'
    root:
      type: disk
      pool: is-nvme-pool
      path: /

snapshot:
  policy_version: 1

  instance_rootfs:
    mode: rebuildable

applications:
  - name: comfyui
    port: 8188
    protocol: http
    entrypoint: /
    exposure: internal
    endpoint:
      mode: passthrough
    verification:
      method: GET
      path: /
      expected_statuses:
        - 200
