name: n8n-comfyui-capsule
display_name: AI Workflow Capsule (n8n & ComfyUI)
description: Dual n8n and ComfyUI pipeline with isolated ZFS workspace and read-only host model vault.
image_alias: qiln-noble-python-node

provisioning:
  volumes:
    - name: workspace
      type: empty
      pool: is-nvme-pool
      mount_path: /workspace
      shifted: true
      readonly: false

    - name: shared-models
      type: bind
      host_path: /srv/qiln/shared/models
      mount_path: /workspace/models
      shifted: true
      readonly: true

  files:
    - path: /workspace/models
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/workflows
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/outputs
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    # - path: /workspace/workflows/app.env
    #   uid: 1000
    #   gid: 1000
    #   mode: '0600'
    #   content: |
    #     # n8n isolation configurations
    #     N8N_ENCRYPTION_KEY={{ secrets.n8n_encryption_key }}
    #     N8N_DATABASE_PROVIDER=sqlite
    #     N8N_DATABASE_PATH=/workspace/n8n/database.sqlite
    #     # ComfyUI environment paths
    #     COMFYUI_EXTRA_MODEL_PATHS=/workspace/extra_model_paths.yaml

    # Inform ComfyUI how to locate models in the read-only mount
    - path: /workspace/extra_model_paths.yaml
      uid: 1000
      gid: 1000
      mode: '0644'
      content: |
        qiln_vault:
          base_path: /workspace/models/comfyui
          checkpoints: checkpoints/
          loras: loras/
          vae: vae/

instance_template:
  config:
    security.privileged: 'false'
    security.nesting: 'false'
    nvidia.runtime: 'true'
    boot.autostart: 'false'
    limits.kernel.memlock: unlimited

  devices:
    eth0:
      type: nic
      network: incusbr0
      security.ipv4_filtering: 'true'
      security.mac_filtering: 'true'
    root:
      type: disk
      pool: is-nvme-pool
      path: /

# Application routing
application:
  ports:
    - name: n8n-ingress
      port: 5678
      protocol: tcp
      exposure: proxy
    - name: comfyui-internal
      port: 8188
      protocol: tcp
      exposure: internal
