schema_version: 1

name: n8n-comfyui-capsule
display_name: AI Workflow Capsule (n8n & ComfyUI)
description: Dual n8n and ComfyUI capsule blueprint with durable branch storage and read-only shared model mount.
image_alias: qiln-noble-python-node

provisioning:
  volumes:
    - name: workspace
      type: empty
      pool: is-nvme-pool
      mount_path: /workspace
      shifted: true
      readonly: false

    - name: shared-models
      type: bind
      host_path: /srv/qiln/shared/models
      mount_path: /workspace/models
      shifted: true
      readonly: true

  # TODO:
  files:
    # - path: /workspace/models
    #   type: directory
    #   uid: 1000
    #   gid: 1000
    #   mode: '0755'

    - path: /workspace/workflows
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/outputs
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    # - path: /workspace/workflows/app.env
    #   uid: 1000
    #   gid: 1000
    #   mode: '0600'
    #   content: |
    #     # n8n isolation configurations
    #     N8N_ENCRYPTION_KEY={{ secrets.n8n_encryption_key }}
    #     N8N_DATABASE_PROVIDER=sqlite
    #     N8N_DATABASE_PATH=/workspace/n8n/database.sqlite
    #     # ComfyUI environment paths
    #     COMFYUI_EXTRA_MODEL_PATHS=/workspace/extra_model_paths.yaml

    # Inform ComfyUI how to locate models in the read-only external mount.
    - path: /workspace/extra_model_paths.yaml
      uid: 1000
      gid: 1000
      mode: '0644'
      content: |
        qiln_vault:
          base_path: /workspace/models/comfyui
          checkpoints: checkpoints/
          loras: loras/
          vae: vae/

runtime:
  config:
    security.privileged: 'false'
    security.nesting: 'false'
    nvidia.runtime: 'true'
    boot.autostart: 'false'
    limits.kernel.memlock: unlimited

  devices:
    eth0:
      type: nic
      network: incusbr0
      security.ipv4_filtering: 'true'
      security.mac_filtering: 'true'
    root:
      type: disk
      pool: is-nvme-pool
      path: /

snapshot_capture:
  policy_version: 1

  artifact_roots:
    - id: workspace
      volume: workspace
      required: true
      required_paths:
        - path: workflows
          type: directory
        - path: outputs
          type: directory
        - path: extra_model_paths.yaml
          type: file

  # Required external mounts are not traversed as ordinary artifacts. A future
  # capture operation must record an immutable dependency reference before the
  # resulting snapshot can become a branch-fork source.
  external_mounts:
    - volume: shared-models
      required: true

  # Repository locations remain empty until the n8n and ComfyUI installation
  # layout is explicitly defined by the capsule runtime.
  git_repositories: []

# Application routing
application:
  ports:
    - name: n8n-ingress
      port: 5678
      protocol: tcp
      exposure: proxy
    - name: comfyui-internal
      port: 8188
      protocol: tcp
      exposure: internal
