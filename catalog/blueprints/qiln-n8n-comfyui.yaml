schema_version: 1

name: n8n-comfyui-capsule
display_name: AI Workflow Capsule (n8n & ComfyUI)
description: Dual n8n and ComfyUI capsule blueprint with durable branch storage and read-only shared model mount.
image_alias: qiln-noble-python-node

provisioning:
  volumes:
    # The seed contains normal, commit-pinned n8n and ComfyUI Git repositories.
    # Each branch receives its own writable ZFS clone rather than sharing source
    # files through a bind mount.
    - name: workspace
      type: clone
      pool: is-nvme-pool
      source_volume: qiln-n8n-c9d4de11-comfyui-306af3a8-v1
      mount_path: /workspace
      shifted: true
      readonly: false

    - name: shared-models
      type: bind
      host_path: /srv/qiln/shared/models
      mount_path: /workspace/models
      shifted: true
      readonly: true

  files:
    - path: /workspace/capsule
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/models
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/capsule/n8n
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/capsule/n8n/workflows
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/capsule/comfyui
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/capsule/comfyui/graphs
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/capsule/comfyui/config
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/capsule/routes
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/capsule/tests
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    - path: /workspace/capsule/shared
      type: directory
      uid: 1000
      gid: 1000
      mode: '0755'

    # The future ComfyUI launcher must pass this file explicitly through
    # ComfyUI's extra-model-path configuration option.
    - path: /workspace/capsule/comfyui/config/extra_model_paths.yaml
      uid: 1000
      gid: 1000
      mode: '0644'
      content: |
        qiln_vault:
          base_path: /workspace/models/comfyui
          checkpoints: checkpoints/
          loras: loras/
          vae: vae/

runtime:
  config:
    security.privileged: 'false'
    security.nesting: 'false'
    nvidia.runtime: 'true'
    boot.autostart: 'false'
    limits.kernel.memlock: unlimited

  devices:
    eth0:
      type: nic
      network: incusbr0
      security.ipv4_filtering: 'true'
      security.mac_filtering: 'true'
    root:
      type: disk
      pool: is-nvme-pool
      path: /

snapshot_capture:
  policy_version: 1

  artifact_roots:
    - id: workspace
      volume: workspace
      required: true
      required_paths:
        - path: apps/n8n
          type: directory
        - path: apps/n8n/package.json
          type: file
        - path: apps/comfyui
          type: directory
        - path: apps/comfyui/main.py
          type: file
        - path: capsule/n8n/workflows
          type: directory
        - path: capsule/comfyui/graphs
          type: directory
        - path: capsule/comfyui/config
          type: directory
        - path: capsule/comfyui/config/extra_model_paths.yaml
          type: file
        - path: capsule/routes
          type: directory
        - path: capsule/tests
          type: directory
        - path: capsule/shared
          type: directory

  # This mount is an external immutable dependency boundary. It is not
  # traversed as ordinary artifact content. The logical identity is resolved
  # to an immutable vault reference during future snapshot capture.
  external_mounts:
    - volume: shared-models
      required: true
      dependency:
        kind: model_vault
        logical_id: shared-models

  # Git records add repository semantics to the canonical filesystem manifest;
  # they do not replace filesystem artifact collection.
  git_repositories:
    - id: n8n
      artifact_root_id: workspace
      path: apps/n8n
      required: true
    - id: comfyui
      artifact_root_id: workspace
      path: apps/comfyui
      required: true

  # `artifact_capture` covers canonical filesystem collection only. It does
  # not claim production restoration, promotion, or rollback readiness.
  #
  # n8n remains evaluation-only until Qiln has deterministic export/import,
  # credential-reference projection, and runtime-state handling.
  application_capabilities:
    - application: comfyui
      support: artifact_capture
    - application: n8n
      support: evaluation_only

applications:
  - name: n8n
    port: 5678
    protocol: http
    entrypoint: /
    exposure: proxy
    endpoint:
      mode: passthrough
    verification:
      method: GET
      path: /healthz
      expected_statuses:
        - 200

  - name: comfyui
    port: 8188
    protocol: http
    entrypoint: /
    exposure: internal
    endpoint:
      mode: passthrough
    verification:
      method: GET
      path: /
      expected_statuses:
        - 200
